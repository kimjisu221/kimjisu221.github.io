<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>은경아 생일 축하해</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe4ec;--bg2:#fff4d6;--card:#ffffffcc;--text:#4a2a3a;--sub:#8a5a70;--y:#ff5c8a;--yt:#fff;--n:#e8dde2;--nt:#7a6470;--ring:#ffc2d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1620;--bg2:#2b2418;--card:#3a2430cc;--text:#ffe9f0;--sub:#e0b3c4;--y:#ff6f9a;--yt:#2a1620;--n:#4a3640;--nt:#d8bcc8;--ring:#6a3a4e}}
:root[data-theme="dark"]{--bg1:#2a1620;--bg2:#2b2418;--card:#3a2430cc;--text:#ffe9f0;--sub:#e0b3c4;--y:#ff6f9a;--yt:#2a1620;--n:#4a3640;--nt:#d8bcc8;--ring:#6a3a4e}
html,body{margin:0}
html{min-height:100%}
body{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;overflow-x:hidden}
body{min-height:100%;padding:24px 0}
.card{background:var(--card);backdrop-filter:blur(6px);border:3px dashed var(--ring);border-radius:28px;padding:36px 24px;width:min(92vw,440px);text-align:center;box-shadow:0 12px 40px #0002}
.cake{font-size:64px;position:relative;z-index:10;margin-top:6px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
h1{font-size:2.1rem;margin:12px 0 6px;line-height:1.25}
p{color:var(--sub);font-size:1.3rem;margin:0 0 24px}
.btns{display:flex;align-items:center;justify-content:center;gap:12px;min-height:90px;flex-wrap:nowrap}
button{font-family:inherit;border:0;cursor:pointer;border-radius:999px;transition:all .35s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
#y{background:var(--y);color:var(--yt);font-size:1.4em;padding:.5em 1.6em;box-shadow:0 6px 0 #0002;max-width:100%}
#n{background:var(--n);color:var(--nt);font-size:1.4em;padding:.5em 1.6em}
#y:active{transform:scale(.95)}
#done{display:none}
.confetti{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

.card{position:relative;overflow:visible}
.collage{position:relative;width:100%;aspect-ratio:1/1.04;margin:-8px 0 10px}
.pol{position:absolute;width:45%;background:#fff;padding:3.2% 3.2% 9%;box-shadow:0 6px 16px #0003;border-radius:3px}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px}
.pol::before{content:"";position:absolute;top:-11px;left:50%;width:34%;height:20px;margin-left:-17%;background:#ffd86b99;transform:rotate(-4deg);box-shadow:0 1px 3px #0002}
.pol:nth-child(even)::before{background:#ff9fbd99;transform:rotate(5deg)}
.p1{left:0;top:2%;transform:rotate(-8deg)}
.p2{right:0;top:0;transform:rotate(6deg);z-index:2}
.p3{left:4%;top:46%;transform:rotate(5deg);z-index:3}
.p4{right:2%;top:50%;transform:rotate(-6deg);z-index:4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pol{background:#f5ecef}}
:root[data-theme="dark"] .pol{background:#f5ecef}
#done .collage{margin-top:-8px}
#cal{display:none}
#cal h1{font-size:1.8rem;margin:4px 0}
.hint{font-size:1.05rem;margin:0 0 8px}
.calhead{display:flex;align-items:center;justify-content:space-between;font-size:1.3rem;margin:8px 0}
.nav{background:var(--n);color:var(--nt);width:38px;height:38px;padding:0;font-size:1.3rem}
.nav:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:.95rem;color:var(--sub);padding-bottom:4px}
.day{aspect-ratio:1;border-radius:50%;background:transparent;color:var(--text);font-size:1.05rem;padding:0}
.day:disabled{opacity:.28;cursor:not-allowed}
.day.sel,.t.sel{background:var(--y);color:var(--yt)}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.t{background:var(--n);color:var(--nt);font-size:1rem;padding:.55em 0;border-radius:14px}
.ok{margin-top:16px;background:var(--y);color:var(--yt);font-size:1.25rem;padding:.6em 1.8em;box-shadow:0 5px 0 #0002}
.ok:disabled{opacity:.4;cursor:default}
</style>
</head>

  <div class="cake">🎂</div>
  <div id="ask">
    <h1>은경아 생일 축하해</h1>
    <p>나랑 놀래?</p>
    <div class="btns">
      <button id="y">Y</button>
      <button id="n">N</button>
    </div>
  </div>
  <div id="cal">
    <h1>언제 놀까?</h1>
    <p class="hint">다음 주부터 고를 수 있어</p>
    <div id="calbox"></div>
    <button class="ok" id="ok" disabled>이 날로 정했어!</button>
  </div>
  <div id="done">
    <h1>야호! 약속이다 🎉</h1>
    <p id="dtext">같이 놀자, 은경아!</p>
    <button class="ok" id="copy">일정 복사하기</button>
  </div>
</main>
<script>
var step=0, y=document.getElementById('y'), n=document.getElementById('n');
n.addEventListener('click',function(){
  step++;
  var ys=1.4+step*0.55, ns=Math.max(1.4*Math.pow(0.72,step),0.35);
  y.style.fontSize=Math.min(ys,5.5)+'em';
  y.style.padding=(0.5+step*0.08)+'em '+(1.6+step*0.2)+'em';
  n.style.fontSize=ns+'em';
  if(step>=7){n.style.display='none';}
});
function confetti(){
  var e=['🎉','🎂','🎈','🎁','✨','💖'];
  for(var i=0;i<40;i++){
    var s=document.createElement('span');
    s.className='confetti';
    s.textContent=e[i%e.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(2+Math.random()*3)+'s';
    s.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(s);
  }
}

var WD=['월','화','수','목','금','토','일'], MIN=new Date(2026,9,26), view=new Date(2026,9,1), selD=null, selT=null;
var box=document.getElementById('calbox'), ok=document.getElementById('ok'), result='';
function blocked(dt){return dt<MIN||(dt.getMonth()===9&&dt.getDate()===31);}
function tl(h){return (h<12?'오전 ':'오후 ')+(h>12?h-12:h)+':00';}
function render(scroll){
  var yr=view.getFullYear(), mo=view.getMonth(), h='';
  h+='<div class="calhead"><button class="nav" data-nav="-1"'+(yr===2026&&mo===9?' disabled':'')+'>‹</button><b>'+yr+'년 '+(mo+1)+'월</b><button class="nav" data-nav="1"'+(yr===2026&&mo===11?' disabled':'')+'>›</button></div><div class="grid">';
  WD.forEach(function(w){h+='<div class="wd">'+w+'</div>';});
  var lead=(new Date(yr,mo,1).getDay()+6)%7, n=new Date(yr,mo+1,0).getDate();
  for(var i=0;i<lead;i++)h+='<div></div>';
  for(var d=1;d<=n;d++){
    var dt=new Date(yr,mo,d), sel=selD&&selD.getTime()===dt.getTime();
    h+='<button class="day'+(sel?' sel':'')+'" data-d="'+d+'"'+(blocked(dt)?' disabled':'')+'>'+d+'</button>';
  }
  h+='</div>';
  if(selD){
    h+='<p class="hint" style="margin-top:14px">시간도 골라줘</p><div class="times">';
    for(var t=11;t<=21;t++)h+='<button class="t'+(selT===t?' sel':'')+'" data-t="'+t+'">'+tl(t)+'</button>';
    h+='</div>';
  }
  box.innerHTML=h;
  ok.disabled=!(selD&&selT!==null);
  if(scroll){var el=box.querySelector('.times');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
}
box.addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b||b.disabled)return;
  if(b.dataset.nav){view=new Date(view.getFullYear(),view.getMonth()+Number(b.dataset.nav),1);render();}
  else if(b.dataset.d){selD=new Date(view.getFullYear(),view.getMonth(),Number(b.dataset.d));render(selT===null);}
  else if(b.dataset.t){selT=Number(b.dataset.t);render();}
});
y.addEventListener('click',function(){
  document.getElementById('ask').style.display='none';
  document.getElementById('cal').style.display='block';
  render();
});
ok.addEventListener('click',function(){
  result=(selD.getMonth()+1)+'월 '+selD.getDate()+'일 ('+WD[(selD.getDay()+6)%7]+') '+tl(selT);
  document.getElementById('dtext').textContent=result+'에 만나자, 은경아!';
  document.getElementById('cal').style.display='none';
  document.getElementById('done').style.display='block';
  window.scrollTo(0,0);
  confetti();
});
document.getElementById('copy').addEventListener('click',function(){
  var btn=this, msg='은경이랑 놀기로 한 날: '+result;
  try{navigator.clipboard.writeText(msg).then(function(){btn.textContent='복사됐어!';},function(){btn.textContent=msg;});}
  catch(e){btn.textContent=msg;}
});
</script>
</body>
</html>
